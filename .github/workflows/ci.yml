name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Déploiement Render : uniquement à la demande (Actions > CI > Run workflow, cocher « deployer »).
  workflow_dispatch:
    inputs:
      deployer:
        description: "Déclencher aussi le déploiement Render (après tests verts)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + tests
        run: mvn -B clean verify

      - name: Uploader le jar (artifact CI)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar

  # ------------------------------------------------------------------
  # Optionnel : déploiement Render MANUEL (jamais automatique à chaque push :
  # un push sur main ne doit pas déployer en production sans décision humaine).
  # Ancien comportement : déclenché à chaque push sur main. Render redéploie déjà automatiquement à chaque push
  # (autoDeploy: true dans render.yaml) si votre repo GitHub est
  # connecté nativement à Render — dans ce cas ce job est redondant
  # et peut être supprimé. Gardez-le seulement si vous préférez
  # piloter le déploiement explicitement via un Deploy Hook.
  # ------------------------------------------------------------------
  deploy-render:
    name: Déclencher le déploiement Render
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deployer == true
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le Render Deploy Hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

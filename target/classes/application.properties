# ============================================================
#  Configuration Spring Boot — MANAO backend
#  Toutes les valeurs sensibles viennent de variables d'environnement
#  (voir .env.example à la racine de backend/).
# ============================================================

spring.application.name=manao-backend
server.port=${SERVER_PORT:4000}
# Le frontend appelle REACT_APP_API_URL=http://localhost:4000/api -> on préfixe tout par /api
server.servlet.context-path=/api

# ── Base de données (Supabase PostgreSQL) ───────────────────
# IMPORTANT (prod) : aucune valeur par défaut ici — DB_URL/DB_USERNAME/DB_PASSWORD
# DOIVENT être fournis via l'environnement (.env en local, variables d'env en prod).
# Cela évite qu'un identifiant réel ne se retrouve committé dans le code source.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool Hikari — réglages de résilience pour le pooler Supabase (pgbouncer, port 6543).
# Sans keepalive, les connexions inactives sont coupées silencieusement par des équipements
# réseau intermédiaires (NAT/firewall/veille système) ; Hikari ne le détecte qu'au moment de
# l'utiliser, ce qui provoque des "Connection is not available" / "Connection refused"
# intermittents (observés en prod) qui font échouer l'authentification (JwtAuthFilter avale
# l'exception et traite la requête comme anonyme -> 401/403 en cascade côté frontend).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.max-lifetime=1700000
spring.datasource.hikari.leak-detection-threshold=30000
# Ne bloque pas indéfiniment le démarrage si la base est momentanément injoignable.
spring.datasource.hikari.initialization-fail-timeout=-1

# ── JPA / Hibernate ──────────────────────────────────────────
# validate: le schéma est créé par database/schema.sql (exécuté dans Supabase SQL Editor),
# Hibernate ne doit pas modifier les tables en production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Forcer le dialecte PostgreSQL aide Hibernate si la connexion JDBC échoue
# (évite l'erreur "Unable to determine Dialect without JDBC metadata").
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────────────────────
# IMPORTANT (prod) : plus de secret par défaut en dur — voir remarque ci-dessus.
# Générez-en un nouveau (openssl rand -base64 48) et invalidez l'ancien, qui a
# circulé dans le code source.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ── CORS ──────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

# ── URL publique du frontend (utilisée pour construire verify_url du QR code) ──
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ── Données de démonstration au démarrage ────────────────────
# IMPORTANT (prod) : mettre SEED_ENABLED=false en production une fois le compte
# admin réel créé — laisser ceci à "true" recrée/expose un compte admin avec un
# mot de passe par défaut connu (ChangeMe123!) à chaque démarrage.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@voyage.mg}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:ChangeMe123!}

# ── Divers ────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# ── Rappel de voyage par WhatsApp (Evolution API — self-hosted) ──
app.evolution.enabled=${EVOLUTION_ENABLED:false}
app.evolution.api-url=${EVOLUTION_API_URL:}
app.evolution.api-key=${EVOLUTION_API_KEY:}
app.evolution.instance=${EVOLUTION_INSTANCE:}
app.evolution.default-country-code=${EVOLUTION_DEFAULT_COUNTRY_CODE:261}

# ── Rappel de voyage par e-mail (Gmail SMTP) ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${GMAIL_USERNAME:}